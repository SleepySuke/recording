<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<style>text{font-family:Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827} .sub{fill:#6b7280;font-size:15px} .label{font-size:15px}</style>
<defs>
<marker id="blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker>
<marker id="gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L8,3.5 L0,7 Z" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="60" y="48" font-size="25" font-weight="600">录音转写与智能摘要 · 总体架构</text>
<text x="60" y="78" class="sub">单个 Go 应用：HTTP 与 worker 同进程；MySQL 独立运行</text>
<rect x="60" y="140" width="240" height="100" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="180" y="191" text-anchor="middle" font-size="19" font-weight="600">客户端</text>
<text x="180" y="218" text-anchor="middle" class="sub">curl / Postman / 后续前端</text>
